[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-aegis"
version = "0.1.0"
description = "Reliability platform for climate project finance diligence."
requires-python = ">=3.9"
dependencies = [
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "jinja2==3.1.5",
  "numpy==2.0.2",
  "pydantic==2.10.4",
  "scikit-learn==1.6.1",
  "uvicorn==0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = [
  "benchmark/tests",
  "models/tests",
  "app/tests",
]
filterwarnings = [
  "ignore:Field name \"schema\" in \"PipelineResult\" shadows an attribute in parent \"BaseModel\":UserWarning",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*", "benchmark*", "models*"]
